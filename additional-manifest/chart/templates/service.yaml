{{- range $index, $pod := .Values.restatePods }}
---
apiVersion: v1
kind: Service
metadata:
  name: restate-regional-{{ $index }}
spec:
  ports:
    - name: node
      port: 5122
      protocol: TCP
      targetPort: 5122
  publishNotReadyAddresses: true
  type: ClusterIP
  selector:
    app: restate
    apps.kubernetes.io/pod-index: "{{ $index }}"
{{- end }}

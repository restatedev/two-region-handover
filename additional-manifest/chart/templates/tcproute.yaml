{{- range $index, $pod := .Values.restatePods }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: restate-{{ $index }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: restate-gateway
      sectionName: restate-{{ $index }}
  rules:
    - backendRefs:
        - name: restate-{{ $index }}
          port: 5122
{{- end }}

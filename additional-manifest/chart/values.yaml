# Restate per-region NLB Helm Chart Values

# DNS suffix for the regional NLB (used by external-dns)
dnsSuffix: ""

# Gateway API config
gatewayClassName: "aws-nlb"
createGatewayClass: true

# NLB config
scheme: "internet-facing"
securityGroups: ""
basePort: 5122

# One entry per Restate pod in this region
restatePods: []
  # - {}  # restate-0
  # - {}  # restate-1
  # - {}  # restate-2

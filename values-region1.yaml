# Region 1 Configuration

replicaCount: 3

# iam with native eks oidc:
serviceAccount:
  annotations:
    # a role that can access the S3 bucket
    eks.amazonaws.com/role-arn: arn:aws:iam::1234567890:role/TwoRegionTest

# iam with kiam:
# podAnnotations:
#    # a role that can access the S3 bucket
#   iam.amazonaws.com/role: arn:aws:iam::1234567890:role/TwoRegionTest

resources:
  requests:
    cpu: 2
    memory: 4Gi
  limits:
    cpu: 4
    memory: 6Gi

nodeName: ""
advertisedAddress: ""

# Derive the advertised address port from the StatefulSet pod ordinal.
# The regional NLB maps port 5122+N to the Service for restate-N.
command: ["/bin/sh", "-c"]
args:
  - |
    ORDINAL=${HOSTNAME##*-}
    PORT=$((5122 + ORDINAL))
    export RESTATE_ADVERTISED_ADDRESS="http://${RESTATE_REGION_DNS}:${PORT}"
    exec restate-server

env:
  # --------------------
  # common params
  # --------------------
  - name: RESTATE_LOG_FORMAT
    value: "json"
  - name: RESTATE_CLUSTER_NAME
    value: "two-region-demo-cluster"
  - name: RESTATE_AUTO_PROVISION
    value: "false"
  - name: RESTATE_ROLES
    value: '["worker","admin","metadata-server","log-server","http-ingress"]'
    # we set this to 75% of the memory request
  - name: RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE
    value: "3GB"
  - name: RESTATE_WORKER__SNAPSHOTS__SNAPSHOT_INTERVAL_NUM_RECORDS
    value: "10000"
  - name: RESTATE_WORKER__EXPERIMENTAL_PARTITION_DRIVEN_LOG_TRIMMING
    value: "true"
  - name: RESTATE_WORKER__TRIM_DELAY_INTERVAL
    value: "15m"

  # --------------------
  # params that need to be overridden
  # --------------------
  - name: RESTATE_NODE_NAME
    value: $(POD_NAME).region1
  - name: RESTATE_LOCATION
    value: region1
  # the regional DNS name for this region's NLB (used by the command wrapper to set RESTATE_ADVERTISED_ADDRESS)
  - name: RESTATE_REGION_DNS
    value: "region1.restate.yourdomain.com"
  # both regions talk to their local bucket for snapshots, cross region replication copies them across
  - name: RESTATE_WORKER__SNAPSHOTS__DESTINATION
    value: "s3://restate-two-region-test-region1/snapshots"
